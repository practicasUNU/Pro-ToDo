# Nginx del contenedor `frontend`: sirve la SPA y enruta la API y los sockets al
# contenedor `backend` de la red `protodo_net`.

# `Connection: upgrade` solo cuando el cliente pide WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Alineado con el mayor limite del backend (SANDBOX_JSON_LIMIT = 10mb).
    client_max_body_size 10m;

    # API REST y Socket.io (`/api/socket.io`, namespace `/events`).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # SOBRESCRIBE la cadena en vez de encadenarla: el backend toma la primera
        # IP de `x-forwarded-for` para el perimetro (client-ip.util.ts), y una
        # cabecera enviada por el cliente no puede colarse delante.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Imagenes de los articulos servidas por el backend (ServeStaticModule).
    location /static/uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA (vueRouterMode: 'hash'): cualquier otra ruta devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index nunca se cachea: apunta a los assets con hash del ultimo build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
